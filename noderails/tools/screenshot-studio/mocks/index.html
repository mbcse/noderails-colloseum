<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NodeRails marketing shots</title>
  <style>
    @font-face {
      font-family: Saans;
      src: url("/apps/landing/src/fonts/SaansUprightsVF.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --bg: #fff;
      --fg: #0a1628;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #635bff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --info-bg: #eef2ff;
      --card-shade: inset 0 1px 0 rgba(255,255,255,.95), 0 1px 2px rgba(99,91,255,.05), 0 8px 22px rgba(99,91,255,.07);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Saans, "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--fg);
      background: #fff;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    .dash { display: flex; height: 900px; width: 1440px; background: #fff; }
    .sidebar {
      width: 248px;
      border-right: 1px solid var(--border);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 8px 8px 16px; }
    .brand svg { width: 28px; height: 28px; }
    .brand b { display: block; font-size: 14px; letter-spacing: -.02em; }
    .brand small { display: block; font-size: 10px; color: var(--muted); }
    .nav-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; padding: 10px 10px 6px; }
    .nav a {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      color: #334155; text-decoration: none; font-size: 13.5px; font-weight: 500;
    }
    .nav a.active { background: #f1f5f9; color: var(--fg); }
    .nav svg { width: 16px; height: 16px; opacity: .75; }
    .app-switch {
      margin: 8px 6px 4px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .app-switch strong { display: block; font-size: 13px; }
    .app-switch span { font-size: 11px; color: var(--muted); }
    .side-foot {
      margin-top: auto; padding: 10px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .avatar { width: 32px; height: 32px; border-radius: 999px; background: #0a1628; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 48px; border-bottom: 1px solid rgba(0,0,0,.04);
      display: flex; align-items: center; gap: 10px; padding: 0 24px; color: #334155; font-size: 14px; font-weight: 600;
    }
    .page { padding: 24px 28px; overflow: hidden; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .card {
      border: 1px solid var(--border); border-radius: 12px; background: #fff;
      box-shadow: var(--card-shade);
      background-image: linear-gradient(180deg, rgba(255,255,255,0) 32%, rgba(99,91,255,.028) 100%);
    }
    .stat { padding: 16px 18px; }
    .stat .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .stat .v { margin-top: 8px; font-size: 26px; font-weight: 650; letter-spacing: -.03em; }
    .stat .s { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .card-h { padding: 14px 16px 0; display: flex; justify-content: space-between; align-items: baseline; }
    .card-h b { font-size: 13px; }
    .card-h span { font-size: 12px; color: var(--muted); }
    .bar-row { padding: 8px 16px; }
    .bar-row .meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .bar { height: 6px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: rgba(99,91,255,.6); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); }
    td { padding: 11px 14px; border-bottom: 1px solid rgba(226,232,240,.7); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    .pill {
      display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .ok { background: var(--success-bg); color: var(--success); }
    .warn { background: var(--warn-bg); color: var(--warn); }
    .bad { background: var(--danger-bg); color: var(--danger); }
    .info { background: var(--info-bg); color: #4338ca; }
    .ghost { background: #f8fafc; color: #475569; border: 1px solid var(--border); }
    .live { background: var(--success-bg); color: var(--success); }
    .filters { display: flex; gap: 8px; margin: 16px 0; }
    .filters span {
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: #475569; background: #f8fafc; border: 1px solid var(--border);
    }
    .filters span.on { background: #0a1628; color: #fff; border-color: #0a1628; }
    .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .muted { color: var(--muted); }
    .tiny { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .row-icon {
      width: 32px; height: 32px; border-radius: 8px; background: #f1f5f9;
      display: grid; place-items: center; color: #475569; flex-shrink: 0;
    }
    .flex { display: flex; align-items: center; gap: 8px; }
    .btn {
      height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--primary); color: #fff;
      font-size: 13px; font-weight: 600;
    }
    .btn-ghost { background: #fff; color: var(--fg); border: 1px solid var(--border); }
    .sheet-wrap { position: relative; }
    .sheet {
      position: absolute; top: 0; right: 0; bottom: 0; width: 420px;
      background: #fff; border-left: 1px solid var(--border);
      box-shadow: -16px 0 40px rgba(15,23,42,.08); padding: 22px 22px 16px; overflow: hidden;
    }
    .sheet h2 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
    .kv { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
    .kv b { font-weight: 500; }
    .section { margin-top: 16px; }
    .section h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .dim { opacity: .55; pointer-events: none; }
    .toggle { width: 36px; height: 20px; border-radius: 99px; background: var(--primary); position: relative; }
    .toggle i { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; background: #fff; border-radius: 99px; }
    .checkout { display: flex; width: 1440px; height: 900px; }
    .co-left {
      width: 38%; color: #cbd5e1; padding: 40px 48px; display: flex; flex-direction: column;
      background: linear-gradient(175deg, #0f172a 0%, #0a1628 38%, #050a14 100%);
      position: relative;
    }
    .co-left::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 50% at 10% 0%, rgba(59,130,246,.14), transparent 55%);
    }
    .co-left > * { position: relative; }
    .co-brand { display: flex; align-items: center; gap: 10px; color: #f1f5f9; font-weight: 600; font-size: 18px; }
    .co-mark { width: 32px; height: 32px; border-radius: 8px; background: rgba(59,130,246,.15); border: 1px solid rgba(96,165,250,.25); display: grid; place-items: center; color: #93c5fd; font-weight: 700; }
    .co-kicker { margin-top: 48px; color: #94a3b8; font-size: 14px; }
    .co-title { margin: 8px 0 0; color: #f8fafc; font-size: 28px; letter-spacing: -.02em; }
    .co-price { margin-top: 28px; color: #fff; font-size: 48px; font-weight: 800; letter-spacing: -.03em; }
    .co-cur { font-size: 18px; font-weight: 500; color: #64748b; }
    .co-card { margin-top: 28px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); padding: 14px 16px; }
    .co-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
    .co-trust { margin-top: auto; display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(148,163,184,.14); background: rgba(15,23,42,.55); }
    .co-right { flex: 1; background: #f8fafc; display: flex; align-items: center; justify-content: center; }
    .pay-card { width: 480px; background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: var(--card-shade); }
    .wallets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .wallets div { border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 600; text-align: center; }
    .primary-cta { margin-top: 18px; height: 44px; border-radius: 10px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 650; }
    .mail { width: 1440px; height: 900px; background: #eef2f7; display: flex; align-items: center; justify-content: center; }
    .mail-card { width: 640px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 50px rgba(15,23,42,.12); }
    .mail-top { padding: 22px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .mail-body { padding: 28px; }
    .chain { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
    .hidden { display: none !important; }
  </style>
</head>
